<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta no sistema premium.">
    <meta name="theme-color" content="#0f172a">
    <title>Dízimo | Gestão dos Dizimistas</title>
        
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <header class="login-header">
                <h2>Criar Conta</h2>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </header>
            
            <form id="registerForm" autocomplete="off">
                <div id="errorMessage" class="error-message">
                    <!-- Erros serão exibidos aqui -->
                </div>

                <div class="input-group">
                    <label for="nome">Login</label>
                    <div class="input-wrapper">
                        <input type="text" id="nome" name="nome" placeholder=" " required autofocus>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" placeholder=" " required autocomplete="new-password">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder=" " required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="login-button" id="submitBtn">
                    <span class="button-text">Gravar Cadastro</span>
                    <i class="ph ph-check"></i>
                </button>

                <footer class="form-footer">
                    <p>Já tem uma conta? <a href="index.html">Fazer Login</a></p>
                </footer>
            </form>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
