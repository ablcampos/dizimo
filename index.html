<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de login moderna e segura para o sistema de gestão.">
    <meta name="theme-color" content="#0f172a">
    <title>Dízimo | Gestão dos Dizimistas</title>
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <header class="login-header">
                <h2>Bem-vindo</h2>
                <p>Acesse sua conta para continuar</p>
            </header>
            
            <form id="loginForm" autocomplete="off">
                <div id="errorMessage" class="error-message">
                    <!-- Erros serão exibidos aqui -->
                </div>

                <div class="input-group">
                    <label for="login">Usuário</label>
                    <div class="input-wrapper">
                        <input type="text" id="login" name="login" placeholder=" " required autofocus>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" placeholder=" " required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="login-button" id="submitBtn">
                    <span class="button-text">Entrar no Sistema</span>
                    <i class="ph ph-arrow-right"></i>
                </button>

                <footer class="form-footer">
                    <p>Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
                    <p style="margin-top: 1rem;"><a href="#" id="generateQRCode" class="qr-link"><i class="ph ph-qr-code"></i> Acesso Mobile (QR Code)</a></p>
                </footer>
            </form>
        </div>
    </main>

    <!-- Modal QR Code -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-content">
            <header class="qr-header">
                <i class="ph ph-qr-code"></i>
                <h3>Acesso Rápido</h3>
                <p>Aponte a câmera do celular para acessar o sistema</p>
            </header>
            
            <div id="qrcode" class="qrcode-container"></div>
            
            <button id="closeQR" class="login-button secondary">
                <i class="ph ph-arrow-left"></i>
                Voltar ao Login
            </button>
        </div>
    </div>

    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
